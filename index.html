<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>プクプク海底探検</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800&display=swap" rel="stylesheet">
<style>
/*
VOICE: 明るくとぼけた海のアドベンチャー
IDEA: 潜水士の手首計器と海中の世界
PICTURE: ゲーム画面そのもの（全画面キャンバス）
COLOUR and TYPE: 深い青緑の海、緑のスライム、珊瑚ピンクのおなら、黄色いおなら呼吸、金の宝物／M PLUS Rounded 1c
LAYOUT: 全画面ゲーム、左上に計器、右下におならボタン2つ
*/
:root{color-scheme:dark;--ink:#eaf8ff;--panel:rgba(4,24,44,.72);--o2:#4fd6f0;--hp:#ff6b6b;--gas:#ff9ec4;--gold:#ffd25e;--fartair:#ffe14d}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;height:100%;overflow:hidden;background:#061a33;color:var(--ink);
  font:16px/1.5 "M PLUS Rounded 1c","Hiragino Maru Gothic ProN",system-ui,sans-serif;
  touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
#game{position:fixed;inset:0;width:100%;height:100%;display:block}
button{font:inherit;color:inherit;cursor:pointer;border:0}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

#hud{position:fixed;top:max(10px,env(safe-area-inset-top));left:max(10px,env(safe-area-inset-left));right:max(10px,env(safe-area-inset-right));
  display:flex;gap:10px;align-items:flex-start;pointer-events:none}
.gauges{background:var(--panel);border:1px solid rgba(255,255,255,.15);border-radius:14px;padding:8px 12px;display:grid;gap:4px;width:min(250px,55vw)}
.row{display:grid;grid-template-columns:3.6em 1fr;align-items:center;gap:8px;font-size:13px;font-weight:800}
.bar{height:11px;border-radius:6px;background:rgba(255,255,255,.14);overflow:hidden}
.bar i{display:block;height:100%;width:100%;border-radius:6px;transition:width .1s linear}
#o2{background:linear-gradient(90deg,#2aa8d8,var(--o2))}
#o2.fart{background:linear-gradient(90deg,#c9a400,var(--fartair))}
#o2Label.fart{color:var(--fartair)}
#hp{background:linear-gradient(90deg,#e04848,var(--hp))}
#gas{background:linear-gradient(90deg,#c99400,#ffd84d)}
/* おなら呼吸に必要な量の目印（白い線）。足りていると光る */
.gaswrap{position:relative}
#gasMark{position:absolute;top:-4px;bottom:-4px;width:3px;margin-left:-1.5px;border-radius:2px;background:rgba(255,255,255,.35)}
#gasMark.ready{background:#fff;box-shadow:0 0 6px #fff,0 0 2px #000}
.low{animation:blink .5s steps(2) infinite}
@keyframes blink{50%{opacity:.35}}
#goal{background:var(--panel);border:1px solid rgba(255,255,255,.15);border-radius:14px;padding:8px 12px;font-size:13px;font-weight:800;line-height:1.35}
#goal .t{color:var(--gold);font-size:17px}
#goal .deep{color:#9fd8ff}
#helpBtn{pointer-events:auto;width:44px;height:44px;border-radius:50%;background:var(--panel);border:1px solid rgba(255,255,255,.25);font-size:20px;font-weight:800;flex:none}

.left{display:flex;gap:10px;align-items:flex-start;min-width:0}
.right{margin-left:auto;display:flex;gap:8px;align-items:flex-start;flex:none}
/* 心拍モニター（演出のみ） */
#heartBox{background:var(--panel);border:1px solid rgba(255,255,255,.15);border-radius:14px;padding:6px 10px 7px;
  display:grid;grid-template-columns:auto 1fr;column-gap:8px;row-gap:2px;align-items:center}
#heartIcon{width:22px;height:22px;fill:var(--hp);display:block}
#heartNum{font-weight:800;line-height:1;white-space:nowrap}
#bpm{font-size:20px;font-variant-numeric:tabular-nums}
#heartNum small{font-size:11px;opacity:.75;margin-left:3px}
#ecg{grid-column:1/-1;width:96px;height:26px;display:block}

.fbtn{position:fixed;border-radius:50%;font-weight:800;line-height:1.1;touch-action:none}
.fbtn small{display:block;font-size:11px;opacity:.8}
.fbtn.empty{filter:grayscale(1) brightness(.7)}
#jetBtn{right:max(18px,env(safe-area-inset-right));bottom:max(18px,env(safe-area-inset-bottom));width:100px;height:100px;font-size:16px;
  background:radial-gradient(circle at 35% 30%,#ffc6dc,#ff7fae 60%,#d9578a);color:#4a1028;
  box-shadow:0 6px 0 #a33a66,0 10px 24px rgba(0,0,0,.35)}
#jetBtn.press{transform:translateY(4px);box-shadow:0 2px 0 #a33a66,0 4px 12px rgba(0,0,0,.35)}
#breathBtn{right:calc(max(18px,env(safe-area-inset-right)) + 112px);bottom:calc(max(18px,env(safe-area-inset-bottom)) + 8px);width:80px;height:80px;font-size:13px;
  /* 外側のリング＝おなら呼吸までのたまり具合。一周したら使える */
  border:5px solid transparent;
  background:radial-gradient(circle at 35% 30%,#fff3a8,#ffd83d 60%,#d1a40f) padding-box,
    conic-gradient(var(--fartair) calc(var(--p,1) * 1turn),rgba(255,255,255,.18) 0) border-box;color:#4a3600;
  box-shadow:0 5px 0 #9c7a07,0 8px 20px rgba(0,0,0,.35)}
#breathBtn.empty{filter:none;color:rgba(40,36,20,.6);
  background:radial-gradient(circle at 35% 30%,#dedbc8,#aca78d 60%,#7d785f) padding-box,
    conic-gradient(var(--fartair) calc(var(--p,1) * 1turn),rgba(255,255,255,.18) 0) border-box}
#breathBtn.ready{animation:ready 1.2s ease-in-out infinite}
@keyframes ready{50%{filter:brightness(1.15)}}
#breathBtn.press{transform:translateY(4px);box-shadow:0 1px 0 #9c7a07,0 4px 12px rgba(0,0,0,.35)}

#stick{position:fixed;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%;
  border:2px solid rgba(255,255,255,.35);background:rgba(255,255,255,.08);display:none;pointer-events:none}
#knob{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;background:rgba(255,255,255,.45)}

#overlay{position:fixed;inset:0;display:grid;place-items:center;padding:16px;background:rgba(3,14,30,.62);backdrop-filter:blur(3px)}
#overlay[hidden]{display:none}
.card{width:min(480px,100%);max-height:100%;overflow:auto;background:linear-gradient(180deg,#0d3b5e,#082640);border:1px solid rgba(255,255,255,.18);
  border-radius:22px;padding:22px 22px 20px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.card h1{font-size:clamp(28px,7vw,40px);line-height:1.05;margin:0 0 6px;font-weight:800;text-wrap:balance}
.card h1 span{color:var(--gas)}
.card p{margin:0 0 12px;font-size:15px;opacity:.92}
.card dl{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;margin:0 0 14px;font-size:14px}
.card dt{font-weight:800;color:var(--gold);white-space:nowrap}
.card dd{margin:0}
.card .big{font-size:22px;font-weight:800;color:var(--gold);margin-bottom:8px}
.card .go{width:100%;min-height:52px;border-radius:14px;background:var(--gold);color:#3a2600;font-weight:800;font-size:18px;box-shadow:0 4px 0 #b88a14}
.card .go:active{transform:translateY(3px);box-shadow:0 1px 0 #b88a14}
.y{color:var(--fartair)}
@media(max-width:600px){.left{flex-direction:column;gap:6px}.right{flex-direction:column;align-items:flex-end}.row{font-size:12px}#goal{font-size:12px}#goal .t{font-size:15px}}
@media(prefers-reduced-motion:reduce){.low,#breathBtn.ready{animation:none}}
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="hud">
  <div class="left">
  <div class="gauges">
    <div class="row"><span id="o2Label">酸素</span><div class="bar"><i id="o2"></i></div></div>
    <div class="row"><span>HP</span><div class="bar"><i id="hp"></i></div></div>
    <div class="row"><span>おなら</span><div class="gaswrap"><div class="bar"><i id="gas"></i></div><b id="gasMark" title="ここを超えるとおなら呼吸できる"></b></div></div>
  </div>
  <div id="goal"></div>
  </div>
  <div class="right">
    <div id="heartBox" aria-label="心拍数">
      <svg id="heartIcon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
      <div id="heartNum"><span id="bpm">80</span><small>bpm</small></div>
      <canvas id="ecg"></canvas>
    </div>
    <button id="helpBtn" aria-label="一時停止と操作方法">?</button>
  </div>
</div>

<button id="breathBtn" class="fbtn" tabindex="-1" aria-label="おなら呼吸">おなら<br>呼吸<small>K</small></button>
<button id="jetBtn" class="fbtn" tabindex="-1" aria-label="おなら噴射（長押し）">おなら<br>噴射<small>Space</small></button>
<div id="stick"><div id="knob"></div></div>

<div id="overlay" role="dialog" aria-modal="true"><div class="card" id="card"></div></div>

<script>
{
// ============================================================
// 0. 素材（自作の画像・効果音への差し替え）
//    assets/ フォルダにファイルを置き、src にパスを書くだけで差し替わります。
//    例: player: {src: 'assets/player.png', w: 40, h: 28, frames: 4, fps: 10},
//    src が空、または読み込みに失敗したときは、今のコード描画・合成音がそのまま使われます。
//    ・画像は透明PNG、すべて「右向き」で描く。w/h はゲーム内の表示サイズ（px）。
//      2倍の解像度で描いておくとスマホでもくっきり見えます。
//    ・frames が2以上なら、コマを横一列に並べたスプライトシートとしてアニメーションします。
//    ・音は mp3 か m4a（iPhoneでも確実に鳴る形式）。jet は長押し中ループするので、
//      つなぎ目なくループできる音にしてください。
// ============================================================
const ASSETS = {
  images: {
    player:   {src: '', w: 44, h: 30, frames: 1, fps: 10},  // 緑のスライム（泳ぐ速さに合わせてコマ送り）
    fish:     {src: '', w: 36, h: 30, frames: 1, fps: 8},   // トゲトゲ魚（近づくとふくらんで拡大）
    jelly:    {src: '', w: 32, h: 44, frames: 1, fps: 6},   // クラゲ
    treasure: {src: '', w: 28, h: 26},                      // 宝箱
    bean:     {src: '', w: 24, h: 18},                      // 豆
    rock:     {src: '', w: 32, h: 32},                      // 岩1マス（上に砂と海藻が重なります）
    boat:     {src: '', w: 110, h: 90},                     // スタートの船（下端が水面）
    shell:    {src: '', w: 26, h: 22},                      // 回復の貝
  },
  sounds: {
    jet:        {src: '', volume: 0.6},  // おなら噴射（長押し中ループ）
    breathe:    {src: '', volume: 0.8},  // おなら呼吸
    hit:        {src: '', volume: 0.8},  // 敵に当たった
    treasure:   {src: '', volume: 0.8},  // 宝物を拾った
    bean:       {src: '', volume: 0.8},  // 豆を食べた
    clear:      {src: '', volume: 0.8},  // 帰還成功
    alarm:      {src: '', volume: 0.6},  // 酸素残りわずか（くり返し鳴る）
    alarmEmpty: {src: '', volume: 0.7},  // 酸素ゼロ（速くくり返し鳴る）
    heal:       {src: '', volume: 0.8},  // 貝でHP回復
    stun:       {src: '', volume: 0.7},  // 噴射のガスで敵がひるんだ
    heartbeat:  {src: '', volume: 1.0},  // 心音（心拍が速いときや危険なときに鳴る。音量は自動で変わる）
  },
};

const Assets = {
  img: {}, buf: {}, el: {}, decoding: false,
  load() {
    for (const [k, a] of Object.entries(ASSETS.images)) {
      if (!a.src) continue;
      const im = new Image(); im.onload = () => { this.img[k] = im; }; im.src = a.src;
    }
    for (const [k, a] of Object.entries(ASSETS.sounds)) {
      if (!a.src) continue;
      const au = new Audio(); au.preload = 'auto'; au.src = a.src; this.el[k] = au;
    }
  },
  // Web Audio で鳴らせるよう読み込む（ローカルファイルで失敗しても <audio> で鳴らす）
  decode(c) {
    if (this.decoding || !c) return; this.decoding = true;
    for (const [k, a] of Object.entries(ASSETS.sounds)) {
      if (!a.src) continue;
      fetch(a.src).then(r => r.ok ? r.arrayBuffer() : Promise.reject())
        .then(b => c.decodeAudioData(b)).then(d => { this.buf[k] = d; }).catch(() => {});
    }
  },
  // 画像があれば (x, y) を中心に描いて true を返す。なければ false（コード描画を使う）
  draw(k, x, y, t = 0, scale = 1) {
    const im = this.img[k]; if (!im) return false;
    const a = ASSETS.images[k], n = a.frames || 1, fw = im.width / n;
    const f = Math.floor(t * (a.fps || 8)) % n, w = a.w * scale, h = a.h * scale;
    ctx.drawImage(im, f * fw, 0, fw, im.height, x - w / 2, y - h / 2, w, h);
    return true;
  },
};
Assets.load();

// ============================================================
// 1. 設定値（ゲームバランスはここを調整）
// ============================================================
const CONFIG = {
  TILE: 32,
  VIEW: 420,               // 画面の短い辺に映る範囲（ワールド座標px）
  O2_MAX: 100,
  O2_DRAIN: 2.6,           // 水中で1秒あたりに減る酸素
  O2_SURFACE: 45,          // 水面で1秒あたりに回復する酸素
  HP_MAX: 100,
  HP_DRAIN: 9,             // 酸素ゼロのとき1秒あたりに減るHP

  GAS_MAX: 100,            // おならゲージの最大値
  GAS_START: 100,
  JET_RATE: 30,            // 噴射中に1秒あたり消費するおなら
  JET_ACCEL: 1050,         // 噴射の加速度
  JET_MAX: 310,            // 噴射中の最高速度
  GAS_REGEN: 0.8,          // 噴射していないとき1秒あたり自然回復するおなら
  BREATH_GAS: 50,          // おなら呼吸1回で消費するおなら（最終手段）
  BREATH_O2: 80,           // おなら呼吸1回で回復する酸素
  FART_AIR_O2_MULT: 2.3,   // おなら呼吸中の酸素の減りの倍率
  FART_AIR_HP_DRAIN: 2.5,  // おなら呼吸中に1秒あたり減るHP（酸素ゼロより遅い）
  BEAN_GAS: 35,            // 豆を拾ったときのおなら回復量
  O2_LOW: 25,              // これ以下で警告音（ゼロになると速い警告音）

  AIR_HEAL: 2,             // 水面・空気だまりで息をしている間、1秒あたり回復するHP
  BOAT_HEAL: 25,           // 船のそばで1秒あたり回復するHP
  SHELL_HEAL: 35,          // 回復の貝で回復するHP
  POISON_HP: 4,            // 毒ガスの中で1秒あたり減るHP
  POISON_O2: 5,            // 毒ガスの中で1秒あたり余分に減る酸素
  STUN_TIME: 1.8,          // 噴射のガスを浴びた敵がひるむ（無害になる）時間
  STUN_RANGE: 95,          // 噴射のガスが届く距離

  DEEP_ROW: 34,            // マップのこの行より下が深海
  DEEP_O2_MULT: 1.7,       // 深海の最深部での酸素の減りの倍率（深いほど増える）
  METERS_PER_TILE: 1.5,    // 水深表示：1マスあたりのメートル

  SWIM_ACCEL: 650,
  SWIM_MAX: 165,
  UP_FACTOR: 0.55,         // 上向きに泳ぐ力の倍率（小さいほど浮きにくい）
  SINK: 170,               // 水中で沈む力
  WATER_DRAG: 2.0,
  GRAVITY: 900,            // 水面より上での重力

  ENEMY_DAMAGE: 15,
  INVULN: 1.2,             // 被弾後の無敵時間
  KNOCKBACK: 260,
};

// ============================================================
// 2. マップ（1文字=1マス）
//    ' ' 空  '.' 水  '#' 岩  'S' スタート  'T' 宝物  'B' 豆（おなら補給）
//    'F' トゲトゲ魚（左右に泳ぐ）  'J' クラゲ（上下に漂う）
//    'A' 空気だまり（水中の空気。顔を出すと息ができる）  'P' 毒ガス  'H' 回復の貝
// ============================================================
const MAP = [
  "                                                            ",
  "                                                            ",
  "                                                            ",
  "...S........................................................",
  "............................................................",
  "............................................................",
  "..........................F.................................",
  "##..........................................................",
  "###.......................................####..............",
  "####....B...............................######..............",
  "#####................J................#########.............",
  "#######..............................##########.............",
  "#########...........................####AAAA###.....T.......",
  "##########.........................####......###.....F......",
  "###########......................#####...B..................",
  "############....................######...####..##...........",
  "#############.................#######PP######..###..........",
  "##############...............#######PP##...##...###......J..",
  "###############............#########PP#..T..#...####........",
  "################.....J....##########PP#.....#...#####.......",
  "#################.........##########..###.###...######......",
  "##################........##########..........#########..H..",
  "###################.......#####################.#######.....",
  "####################.......####################..######.....",
  "#####################.......###################...#####.....",
  "######################...PPPPP#########.......B...####......",
  "#######################..PPPPPPPPP......F..............#....",
  "########################.PPPPPPPPP...................###....",
  "#########################PPPPP######################.####...",
  "##########################...##################.....###...J.",
  "###########################..#########.AAAAT........##......",
  "###########################......##..H.....#####.........T..",
  "#############################....F.....###########..........",
  "##############################......###############.........",
  "###############################....###################....##",
  "###############################....###################....##",
  "#####AAAA######################....###################....##",
  "#####AAAA#############.......................#########....##",
  "####......................................................##",
  "####..........................F...........................##",
  "##.............J......................J...................##",
  "##.................###########..............#######.......##",
  "##.................###########..............#######.......##",
  "##.................###########..............#######.......##",
  "##..........B...........................F...#######..H....##",
  "#####.....................................................##",
  "########..############################################...###",
  "########..############################################...###",
  "########..############################################...###",
  "##AA####..############################################...###",
  "##AA####PP#################################AAAA#######...###",
  "##..PPP#PP#PPPPPPPPPPPPPPPPP###############AAAA#######...###",
  "##..PPP#PP#PPPPPPPPPPPPPPPPP######........................##",
  "##PP#PP#PP#PP#PP####PP#PP#PP######..............H.........##",
  "##PPPPP#PPPPPPPP#PPPPPPPP#PP##............................##",
  "##PPPPP#PPPPPPPP#PPPPPPPP#PP##......#####.................##",
  "##PP#PP#PP#######PP####PP#PP##......#####...F.............##",
  "##PP#PPPPPPPPPPPPPPPPPPPPPPP##......#####.........J.......##",
  "##PP#PPPPPPPPPPPPPPPPPPPPPPP##......#####.................##",
  "##PP###################PP#PP##.................######.....##",
  "##PPPPP#PPPPPPTPPPPPPP#PPPPP##.................######.....##",
  "##PPPPP#PPPPPPPPPPPPPP#PPPPP##.................######.....##",
  "#####PP####PP#PP####PP#PP#PP##............J...............##",
  "##PPPPPPPPPPPPPP#PPPPPPPP#PPPP...B......................T.##",
  "##PPPPPPPPPPPPPP#PPPPPPPP#PPPP............................##",
  "############################################################",
  "############################################################",
  "############################################################",
];

// ============================================================
// 3. ワールド
// ============================================================
const T = CONFIG.TILE;
const World = {
  cols: MAP[0].length, rows: MAP.length,
  grid: [], items: [], spawns: [], start: {x: 0, y: 0}, waterTop: 0,
  load() {
    this.grid = MAP.map(r => r.split(''));
    this.items = []; this.spawns = [];
    this.waterTop = MAP.findIndex(r => r.includes('.')) * T;
    this.grid.forEach((row, ty) => row.forEach((c, tx) => {
      const cx = tx * T + T / 2, cy = ty * T + T / 2;
      if (c === 'S') this.start = {x: cx, y: cy};
      if (c === 'T') this.items.push({type: 'treasure', x: cx, y: cy, got: false});
      if (c === 'B') this.items.push({type: 'bean', x: cx, y: cy, got: false});
      if (c === 'F') this.spawns.push({type: 'fish', x: cx, y: cy});
      if (c === 'J') this.spawns.push({type: 'jelly', x: cx, y: cy});
      if (c === 'H') this.items.push({type: 'shell', x: cx, y: cy, got: false});
      if ('STBFJH'.includes(c)) row[tx] = ty * T >= this.waterTop ? '.' : ' ';
    }));
  },
  get w() { return this.cols * T; },
  get h() { return this.rows * T; },
  solid(tx, ty) {
    if (tx < 0 || tx >= this.cols || ty >= this.rows) return true;
    if (ty < 0) return false;
    return this.grid[ty][tx] === '#';
  },
  solidAt(x, y) { return this.solid(Math.floor(x / T), Math.floor(y / T)); },
  tile(x, y) { return this.grid[Math.floor(y / T)]?.[Math.floor(x / T)]; },
  isAir(x, y) { return y < this.waterTop || this.tile(x, y) === 'A'; },   // 水面より上か空気だまり
  isPoison(x, y) { return this.tile(x, y) === 'P'; },
  // 深海の深さ（0＝深海の入口より上、1＝最深部）
  deepness(y) { const top = CONFIG.DEEP_ROW * T; return Math.max(0, Math.min(1, (y - top) / (this.h - top - 2 * T))); },
  inDeep(y) { return y > CONFIG.DEEP_ROW * T; },
  hits(b) {
    const x0 = Math.floor(b.x / T), x1 = Math.floor((b.x + b.w - 0.01) / T);
    const y0 = Math.floor(b.y / T), y1 = Math.floor((b.y + b.h - 0.01) / T);
    for (let ty = y0; ty <= y1; ty++) for (let tx = x0; tx <= x1; tx++) if (this.solid(tx, ty)) return true;
    return false;
  },
};

// ============================================================
// 4. 入力（キーボード＋タッチ）
// ============================================================
const Input = {
  keys: new Set(), stick: {x: 0, y: 0, id: null, ox: 0, oy: 0}, jetTouch: null, breathQueued: false,
  axis() {
    const k = this.keys;
    let x = (k.has('ArrowRight') || k.has('KeyD') ? 1 : 0) - (k.has('ArrowLeft') || k.has('KeyA') ? 1 : 0);
    let y = (k.has('ArrowDown') || k.has('KeyS') ? 1 : 0) - (k.has('ArrowUp') || k.has('KeyW') ? 1 : 0);
    if (this.stick.id !== null) { x = this.stick.x; y = this.stick.y; }
    const len = Math.hypot(x, y);
    return len > 1 ? {x: x / len, y: y / len} : {x, y};
  },
  jet() { return this.keys.has('Space') || this.keys.has('KeyJ') || this.jetTouch !== null; },
  clear() { this.keys.clear(); this.jetTouch = null; this.breathQueued = false; },
};

// ============================================================
// 5. プレイヤー（緑の人型スライム）
// ============================================================
const Player = {
  reset() {
    Object.assign(this, {
      w: 26, h: 16, x: World.start.x - 13, y: World.start.y - 8, vx: 0, vy: 0, face: 1,
      o2: CONFIG.O2_MAX, hp: CONFIG.HP_MAX, gas: CONFIG.GAS_START,
      treasure: 0, kick: 0, hurt: 0, inv: 0, msgCool: 0,
      jetting: false, jetDir: {x: 1, y: 0}, fartAir: false, poisoned: false, wasDeep: false,
    });
  },
  get cx() { return this.x + this.w / 2; },
  get cy() { return this.y + this.h / 2; },
  inWater() { return !World.isAir(this.cx, this.cy); },
  underwater() { return !World.isAir(this.cx, this.y + 4); },   // 頭が空気に出ていなければ水中
  nearBoat() { return Math.abs(this.cx - World.start.x) < 80 && this.y < World.waterTop + 24; },
  update(dt) {
    const a = Input.axis(), C = CONFIG, water = this.inWater();
    if (a.x) this.face = Math.sign(a.x);

    // 泳ぎ：上向きは弱く、何もしないとゆっくり沈む
    if (water) {
      this.vx += a.x * C.SWIM_ACCEL * dt;
      this.vy += (a.y * C.SWIM_ACCEL * (a.y < 0 ? C.UP_FACTOR : 1) + C.SINK) * dt;
    } else {
      this.vy += C.GRAVITY * dt;
      this.vx += a.x * C.SWIM_ACCEL * 0.3 * dt;
    }

    // おなら噴射：押している間だけゲージを消費して進む
    const wasJetting = this.jetting;
    this.jetting = false;
    if (Input.jet()) {
      if (this.gas > 0) {
        let dx = a.x, dy = a.y;
        if (!dx && !dy) dx = this.face;
        const len = Math.hypot(dx, dy); dx /= len; dy /= len;
        this.vx += dx * C.JET_ACCEL * dt; this.vy += dy * C.JET_ACCEL * dt;
        this.gas = Math.max(0, this.gas - C.JET_RATE * dt);
        this.jetting = true; this.jetDir = {x: dx, y: dy};
        for (let i = 0; i < 2; i++) FX.jetPuff(this.cx - dx * 16, this.cy - dy * 10, -dx, -dy);
        Enemies.blast(this.cx, this.cy, dx, dy); // 後ろに出るガスで敵をひるませる
        if (!wasJetting) { Game.flashOn(); Sound.jetStart(); }
        if (this.gas <= 0) this.say('おならが切れた…', '#cfd8e3');
      } else if (!wasJetting && this.msgCool <= 0) {
        this.say('おならが出ない…', '#cfd8e3');
      }
    }
    if (!this.jetting && wasJetting) Sound.jetStop();
    if (!this.jetting) this.gas = Math.min(C.GAS_MAX, this.gas + C.GAS_REGEN * dt); // 時間でわずかに回復

    if (water) {
      const drag = Math.exp(-C.WATER_DRAG * dt);
      this.vx *= drag; this.vy *= drag;
      const sp = Math.hypot(this.vx, this.vy), max = this.jetting ? C.JET_MAX : C.SWIM_MAX;
      if (sp > max) { const k = Math.exp(-4 * dt); this.vx *= k; this.vy *= k; }
    }

    this.kick += dt * (Math.hypot(a.x, a.y) > 0.1 || this.jetting ? 12 : 3);
    this.hurt = Math.max(0, this.hurt - dt);
    this.inv = Math.max(0, this.inv - dt);
    this.msgCool = Math.max(0, this.msgCool - dt);
    this.move(this.vx * dt, this.vy * dt);

    // 酸素とHP
    if (this.underwater()) {
      const deepMult = 1 + (C.DEEP_O2_MULT - 1) * World.deepness(this.cy);   // 深いほど酸素の減りが速い
      this.o2 = Math.max(0, this.o2 - C.O2_DRAIN * deepMult * (this.fartAir ? C.FART_AIR_O2_MULT : 1) * dt);
    } else {
      // 水面・空気だまりで息をしている：酸素回復、HPもゆっくり回復（船のそばでは一気に）
      this.o2 = Math.min(C.O2_MAX, this.o2 + C.O2_SURFACE * dt);
      if (this.fartAir) { this.fartAir = false; FX.text(this.cx, this.y - 12, 'ぷはっ！ 新鮮な空気', '#ffffff'); }
      if (this.hp < C.HP_MAX) this.hp = Math.min(C.HP_MAX, this.hp + C.AIR_HEAL * dt);
    }
    // 船のそば（水面付近）にいる間は、波で上下していてもHPが一気に回復
    if (this.nearBoat() && this.hp < C.HP_MAX) {
      this.hp = Math.min(C.HP_MAX, this.hp + C.BOAT_HEAL * dt);
      if (this.msgCool <= 0) { this.say('船で休憩…HP回復', '#b6f08a'); this.msgCool = 2; }
    }
    if (this.o2 <= 0) { this.hp = Math.max(0, this.hp - C.HP_DRAIN * dt); this.hurt = 0.2; }
    else if (this.fartAir) this.hp = Math.max(0, this.hp - C.FART_AIR_HP_DRAIN * dt);

    const deepNow = World.inDeep(this.cy);
    if (deepNow && !this.wasDeep) { this.say('深海…酸素の減りが速くなる', '#9fd8ff'); this.msgCool = 2.5; }
    this.wasDeep = deepNow;

    // 毒ガス：HPと酸素が減る。おなら呼吸の泡の中なら防げる
    const inPoison = World.isPoison(this.cx, this.cy);
    this.poisoned = inPoison && !this.fartAir;
    if (this.poisoned) {
      this.hp = Math.max(0, this.hp - C.POISON_HP * dt);
      this.o2 = Math.max(0, this.o2 - C.POISON_O2 * dt);
      if (this.msgCool <= 0) { this.say('ゴホッ…毒ガスだ', '#b6f08a'); this.msgCool = 2.5; }
    } else if (inPoison && this.msgCool <= 0) { this.say('くさい…', '#ffe14d'); this.msgCool = 3; }
  },
  move(dx, dy) {
    const steps = Math.ceil(Math.max(Math.abs(dx), Math.abs(dy)) / 4) || 1;
    for (let i = 0; i < steps; i++) {
      this.x += dx / steps;
      if (World.hits(this)) { this.x -= dx / steps; this.vx *= -0.2; dx = 0; }
      this.y += dy / steps;
      if (World.hits(this)) { this.y -= dy / steps; this.vy *= -0.2; dy = 0; }
    }
  },
  say(s, color) { FX.text(this.cx, this.y - 12, s, color); this.msgCool = 0.8; },
  // おなら呼吸：緊急用。黄色い泡に包まれ、水面に出るまでおならで呼吸する
  breathe() {
    if (!this.underwater()) { if (this.msgCool <= 0) this.say('はぁ…くさかった…', '#ffffff'); return; }
    if (this.gas < CONFIG.BREATH_GAS) { if (this.msgCool <= 0) this.say(`おならが足りない（${CONFIG.BREATH_GAS}%必要）`, '#cfd8e3'); return; }
    this.gas -= CONFIG.BREATH_GAS;
    const before = this.o2;
    this.o2 = Math.min(CONFIG.O2_MAX, this.o2 + CONFIG.BREATH_O2);
    this.fartAir = true;
    Game.flashOn(); Sound.breathe();
    FX.fartBurst(this.cx, this.cy);
    this.say(`すぅ…げほっ！ 酸素+${Math.round(this.o2 - before)}`, '#ffe14d');
  },
  hit(ex, ey) {
    if (this.inv > 0) return;
    this.hp = Math.max(0, this.hp - CONFIG.ENEMY_DAMAGE);
    this.inv = CONFIG.INVULN; this.hurt = 0.3;
    let dx = this.cx - ex, dy = this.cy - ey; const len = Math.hypot(dx, dy) || 1;
    this.vx = dx / len * CONFIG.KNOCKBACK; this.vy = dy / len * CONFIG.KNOCKBACK;
    FX.text(this.cx, this.y - 12, `いたっ！ -${CONFIG.ENEMY_DAMAGE}`, '#ff8080');
    Sound.hit(); Heart.spike(25);
  },
};

// ============================================================
// 6. 敵キャラ
// ============================================================
const Enemies = {
  list: [],
  load() {
    this.list = World.spawns.map((s, i) => s.type === 'fish'
      ? {type: 'fish', x: s.x, y: s.y, baseY: s.y, vx: (i % 2 ? -1 : 1) * 60, r: 11, puff: 0, ph: i * 1.7, stun: 0, kx: 0, ky: 0}
      : {type: 'jelly', x: s.x, y: s.y, baseX: s.x, baseY: s.y, r: 13, ph: i * 2.3, stun: 0, kx: 0, ky: 0});
  },
  // 噴射のガス：プレイヤーの真後ろ（扇形）にいる敵をひるませて押し流す
  blast(px, py, dx, dy) {
    const R = CONFIG.STUN_RANGE;
    for (const e of this.list) {
      const ex = e.x - px, ey = e.y - py, d = Math.hypot(ex, ey);
      if (d > R || d < 1 || (ex * -dx + ey * -dy) / d < 0.55) continue;
      if (e.stun <= 0) { FX.text(e.x, e.y - 20, 'くさい！', '#c8f08a'); Sound.stun(); }
      e.stun = CONFIG.STUN_TIME;
      const push = 60 + 220 * (1 - d / R);
      e.kx = -dx * push; e.ky = -dy * push;
    }
  },
  update(dt) {
    for (const e of this.list) {
      const near = Math.hypot(Player.cx - e.x, Player.cy - e.y);
      const stunned = e.stun > 0;
      if (stunned) {
        // 押し流される（岩には入らない）
        e.stun -= dt;
        const mx = e.kx * dt, my = e.ky * dt, k = Math.exp(-3 * dt);
        e.kx *= k; e.ky *= k;
        if (!World.solidAt(e.x + mx + Math.sign(mx) * e.r, e.y)) { if (e.type === 'fish') e.x += mx; else e.baseX += mx; }
        if (!World.solidAt(e.x, e.y + my + Math.sign(my) * e.r)) e.baseY += my;
      }
      if (e.type === 'fish') {
        if (!stunned) {
          const nx = e.x + e.vx * dt;
          if (World.solidAt(nx + Math.sign(e.vx) * (e.r + 4), e.y)) e.vx = -e.vx; else e.x = nx;
        }
        e.y = e.baseY + Math.sin(Game.clock * 2 + e.ph) * 6;
        e.puff += ((near < 110 && !stunned ? 1 : 0) - e.puff) * Math.min(1, dt * 5);
        e.r = 11 + e.puff * 6;
      } else {
        e.y = e.baseY + Math.sin(Game.clock * 0.9 + e.ph) * 40;
        e.x = e.baseX + Math.sin(Game.clock * 0.4 + e.ph) * 14;
      }
      if (!stunned && near < e.r + 10) Player.hit(e.x, e.y);
    }
  },
};

// ============================================================
// 6b. 心拍（ゲームには影響しない演出）
//     80bpmから、酸素・体力の消耗、おなら呼吸、毒、被弾で上がり、最大200bpm。
//     酸素ゼロで体力が10以下になると、逆に急激に落ちていく。
// ============================================================
// 心電図の波形（拍動からの経過秒数 → 高さ）。1/60秒刻みでサンプルされるので、QRSはその刻みに合わせてある
function ecgWave(tb, period) {
  const s = 1 / 60;
  if (tb < s) return -0.15 * tb / s;
  if (tb < 2 * s) return -0.15 + 1.15 * (tb - s) / s;
  if (tb < 3 * s) return 1 - 1.35 * (tb - 2 * s) / s;
  if (tb < 4 * s) return -0.35 + 0.35 * (tb - 3 * s) / s;
  const tc = Math.min(0.3, period * 0.42);
  return 0.22 * Math.exp(-(((tb - tc) / 0.045) ** 2));
}
const Heart = {
  bpm: 80, tb: 0, acc: 0, dying: false, trace: new Float32Array(100), head: 0,
  reset() { this.bpm = 80; this.tb = 0; this.acc = 0; this.dying = false; this.trace.fill(0); this.head = 0; },
  spike(n) { if (!this.dying) this.bpm = Math.min(200, this.bpm + n); },
  target() {
    const P = Player, C = CONFIG;
    this.dying = P.o2 <= 0 && P.hp <= 10;
    if (this.dying) return 30 + ((P.hp / 10) ** 2) * 90;    // 限界が近いほど急激に落ちる
    let t = 80;
    if (P.o2 < 50) t += (1 - P.o2 / 50) * 55;              // 酸素の消耗
    t += (1 - P.hp / C.HP_MAX) * 45;                        // 体力の消耗
    if (P.fartAir) t += 55;                                 // 臭くて苦しい
    if (P.poisoned) t += 15;
    if (P.jetting) t += 6;
    if (P.underwater()) t += Game.depth * 10 + World.deepness(P.cy) * 12; // 深いほど不安
    return Math.min(200, t);
  },
  update(dt) {
    const tgt = this.target(), rate = this.dying ? 3 : (tgt > this.bpm ? 0.9 : 0.35);
    this.bpm += (tgt - this.bpm) * (1 - Math.exp(-rate * dt));
    const step = 1 / 60, N = this.trace.length;
    this.acc += dt;
    while (this.acc >= step) {
      this.acc -= step; this.tb += step;
      const period = 60 / this.bpm;
      if (this.tb >= period) { this.tb = 0; this.beat(period); }
      this.trace[this.head] = ecgWave(this.tb, period); this.head = (this.head + 1) % N;
    }
  },
  beat(period) {
    if (!reduceMotion) $('heartIcon').animate([{transform: 'scale(1.3)'}, {transform: 'scale(1)'}], {duration: Math.min(220, period * 500), easing: 'ease-out'});
    if (Game.state === 'play' && (this.bpm >= 115 || this.dying)) Sound.heartbeat(this.dying ? 0.3 : Math.min(0.22, (this.bpm - 105) / 400));
  },
  color() { return this.dying || this.bpm >= 150 ? '#ff6b6b' : this.bpm >= 110 ? '#ffe14d' : '#7dffa8'; },
  draw() {
    const cv = $('ecg'), r = Math.min(window.devicePixelRatio || 1, 2), w = 96, h = 26;
    if (cv.width !== w * r) { cv.width = w * r; cv.height = h * r; }
    const g = cv.getContext('2d'), N = this.trace.length;
    g.setTransform(r, 0, 0, r, 0, 0); g.clearRect(0, 0, w, h);
    g.strokeStyle = 'rgba(255,255,255,.12)'; g.lineWidth = 1;
    g.beginPath(); g.moveTo(0, h * 0.62); g.lineTo(w, h * 0.62); g.stroke();
    g.strokeStyle = this.color(); g.lineWidth = 1.6; g.lineJoin = 'round'; g.beginPath();
    for (let i = 0; i < N; i++) {
      const v = this.trace[(this.head + i) % N], x = i / (N - 1) * w, y = h * 0.62 - v * h * 0.5;
      i ? g.lineTo(x, y) : g.moveTo(x, y);
    }
    g.stroke();
    const num = String(Math.round(this.bpm));
    if ($('bpm').textContent !== num) $('bpm').textContent = num;
    $('bpm').style.color = this.color();
  },
};

// ============================================================
// 7. エフェクト（泡・文字）
// ============================================================
const FX = {
  parts: [], texts: [],
  bubble(x, y, r = 2 + Math.random() * 2, color = 'rgba(220,245,255,.8)') {
    this.parts.push({x, y, vx: (Math.random() - .5) * 20, vy: -30 - Math.random() * 30, r, life: 1.6 + Math.random(), color});
  },
  jetPuff(x, y, dx, dy) {
    const s = 80 + Math.random() * 120, ang = Math.atan2(dy, dx) + (Math.random() - .5) * 0.9;
    this.parts.push({x, y, vx: Math.cos(ang) * s, vy: Math.sin(ang) * s, r: 2.5 + Math.random() * 4, life: 0.7 + Math.random() * .6,
      color: Math.random() < .5 ? 'rgba(230,230,100,.75)' : 'rgba(250,250,120,.75)'});
  },
  fartBurst(x, y) {
    for (let i = 0; i < 26; i++) {
      const ang = Math.random() * Math.PI * 2, s = 40 + Math.random() * 90;
      this.parts.push({x, y, vx: Math.cos(ang) * s, vy: Math.sin(ang) * s, r: 3 + Math.random() * 5, life: 0.8 + Math.random() * .7,
        color: 'rgba(255,225,80,.8)'});
    }
  },
  text(x, y, s, color) { this.texts.push({x, y, s, color, life: 1.4}); },
  update(dt) {
    for (const p of this.parts) {
      p.vx *= Math.exp(-2 * dt); p.vy = p.vy * Math.exp(-2 * dt) - 40 * dt;
      p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt;
      if (World.isAir(p.x, p.y)) p.life = 0;
    }
    this.parts = this.parts.filter(p => p.life > 0);
    for (const t of this.texts) { t.y -= 22 * dt; t.life -= dt; }
    this.texts = this.texts.filter(t => t.life > 0);
  },
};

// ============================================================
// 8. サウンド（Web Audioで合成。ファイル不要）
// ============================================================
const Sound = {
  ctx: null, jet: null,
  init() {
    if (!this.ctx) { try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
    this.ctx?.resume?.().catch(() => {});
    Assets.decode(this.ctx);
  },
  // 自作の音声ファイルがあれば鳴らして、止めるためのハンドルを返す。なければ null（合成音を使う）
  file(k, loop = false, mul = 1) {
    const a = ASSETS.sounds[k]; if (!a?.src) return null;
    const c = this.ctx, b = Assets.buf[k], vol = (a.volume ?? 1) * mul;
    if (c && b) {
      const s = c.createBufferSource(), g = c.createGain();
      s.buffer = b; s.loop = loop; g.gain.value = vol; s.connect(g); g.connect(c.destination); s.start();
      return {stop: () => { try { s.stop(); } catch (e) {} }};
    }
    const el = Assets.el[k]; if (!el || el.error) return null;
    const e = loop ? el : el.cloneNode();
    e.loop = loop; e.volume = Math.min(1, vol); e.currentTime = 0; e.play().catch(() => {});
    return {stop: () => e.pause()};
  },
  // 噴射中ずっと鳴る「ぶぼぼぼ…」
  jetStart() {
    if (this.jet) return;
    const h = this.file('jet', true); if (h) { this.jet = {file: h}; return; }
    const c = this.ctx; if (!c) return;
    const t = c.currentTime, o = c.createOscillator(), g = c.createGain(), f = c.createBiquadFilter();
    const lfo = c.createOscillator(), lg = c.createGain();
    o.type = 'sawtooth'; o.frequency.setValueAtTime(115, t); o.frequency.exponentialRampToValueAtTime(70, t + 2.5);
    lfo.frequency.value = 24; lg.gain.value = 22; lfo.connect(lg); lg.connect(o.frequency);
    f.type = 'lowpass'; f.frequency.value = 550;
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.25, t + 0.04);
    o.connect(f); f.connect(g); g.connect(c.destination);
    o.start(t); lfo.start(t);
    this.jet = {o, lfo, g};
  },
  jetStop() {
    const c = this.ctx, j = this.jet; if (!j) return;
    if (j.file) { j.file.stop(); this.jet = null; return; }
    if (!c) return;
    const t = c.currentTime;
    j.g.gain.cancelScheduledValues(t); j.g.gain.setTargetAtTime(0.0001, t, 0.04);
    j.o.stop(t + 0.25); j.lfo.stop(t + 0.25);
    this.jet = null;
  },
  breathe() {
    if (this.file('breathe')) return;
    const c = this.ctx; if (!c) return;
    const t = c.currentTime, dur = 0.55;
    const o = c.createOscillator(), g = c.createGain(), f = c.createBiquadFilter();
    o.type = 'sawtooth'; o.frequency.setValueAtTime(70, t); o.frequency.exponentialRampToValueAtTime(140, t + dur);
    f.type = 'lowpass'; f.frequency.value = 700;
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.3, t + 0.05); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(f); f.connect(g); g.connect(c.destination); o.start(t); o.stop(t + dur);
    this.ding(660);
  },
  // 酸素の警告音（level 1: 残りわずか、2: ゼロ）
  alarm(level) {
    if (this.file(level === 2 ? 'alarmEmpty' : 'alarm')) return;
    const c = this.ctx; if (!c) return;
    const t = c.currentTime, notes = level === 2 ? [740, 520] : [880];
    notes.forEach((fq, i) => {
      const o = c.createOscillator(), g = c.createGain(), s = t + i * 0.13;
      o.type = 'square'; o.frequency.value = fq;
      g.gain.setValueAtTime(0.0001, s); g.gain.exponentialRampToValueAtTime(0.09, s + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, s + 0.11);
      o.connect(g); g.connect(c.destination); o.start(s); o.stop(s + 0.12);
    });
  },
  treasure() { if (!this.file('treasure')) this.ding(880); },
  heal() { if (!this.file('heal')) this.ding(700); },
  // 心音「ドクッ、ドクン」。vol は心拍に合わせて 0〜0.3 程度
  heartbeat(vol) {
    if (this.file('heartbeat', false, vol / 0.3)) return;
    const c = this.ctx; if (!c) return;
    const t = c.currentTime;
    [[0, 62, vol], [0.13, 50, vol * 0.7]].forEach(([d, fq, v]) => {
      const o = c.createOscillator(), g = c.createGain(), s = t + d;
      o.type = 'sine'; o.frequency.setValueAtTime(fq, s); o.frequency.exponentialRampToValueAtTime(fq * 0.6, s + 0.1);
      g.gain.setValueAtTime(0.0001, s); g.gain.exponentialRampToValueAtTime(Math.max(0.0002, v), s + 0.015); g.gain.exponentialRampToValueAtTime(0.0001, s + 0.12);
      o.connect(g); g.connect(c.destination); o.start(s); o.stop(s + 0.13);
    });
  },
  stun() {
    if (this.file('stun')) return;
    const c = this.ctx; if (!c) return;
    const t = c.currentTime, o = c.createOscillator(), g = c.createGain();
    o.type = 'triangle'; o.frequency.setValueAtTime(420, t); o.frequency.exponentialRampToValueAtTime(140, t + 0.2);
    g.gain.setValueAtTime(0.12, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.22);
    o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + 0.22);
  },
  bean() { if (!this.file('bean')) this.ding(520); },
  clear() { if (!this.file('clear')) this.ding(1040); },
  hit() {
    if (this.file('hit')) return;
    const c = this.ctx; if (!c) return;
    const t = c.currentTime, o = c.createOscillator(), g = c.createGain();
    o.type = 'square'; o.frequency.setValueAtTime(220, t); o.frequency.exponentialRampToValueAtTime(70, t + 0.25);
    g.gain.setValueAtTime(0.15, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.25);
    o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + 0.25);
  },
  ding(freq = 880) {
    const c = this.ctx; if (!c) return;
    const t = c.currentTime, o = c.createOscillator(), g = c.createGain();
    o.type = 'triangle'; o.frequency.setValueAtTime(freq, t); o.frequency.setValueAtTime(freq * 1.5, t + 0.08);
    g.gain.setValueAtTime(0.2, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.35);
    o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + 0.35);
  },
};

// ============================================================
// 9. ゲーム進行
// ============================================================
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const Game = {
  state: 'title', time: 0, total: 0, cam: {x: 0, y: 0}, scale: 1, bubbleT: 0, clock: 0, dt: 0, flash: 0, alarmT: 0,
  vis: {dark: 0, yellow: 0, green: 0}, depth: 0, // 視界の悪さ（0〜1）、深さ（0〜1）
  reset() {
    World.load(); Player.reset(); Enemies.load(); Heart.reset();
    FX.parts = []; FX.texts = [];
    this.total = World.items.filter(i => i.type === 'treasure').length;
    this.time = 0; this.flash = 0; this.alarmT = 0; this.vis = {dark: 0, yellow: 0, green: 0};
    this.cam.x = Player.cx; this.cam.y = Player.cy;
  },
  start() { Input.clear(); this.reset(); this.state = 'play'; UI.hide(); },
  flashOn() { this.flash = 1; },
  update(dt) {
    this.clock += dt; this.dt = dt;
    this.flash = Math.max(0, this.flash - dt * 3.5);
    if (this.state !== 'play') { Sound.jetStop(); FX.update(dt); return; }
    this.time += dt;
    if (Input.breathQueued) { Player.breathe(); Input.breathQueued = false; }
    Player.update(dt);
    Enemies.update(dt);
    this.depth = Math.max(0, Math.min(1, (Player.cy - World.waterTop) / (World.h - World.waterTop - 64)));
    Heart.update(dt);

    // アイテム取得
    for (const it of World.items) {
      if (it.got || Math.hypot(it.x - Player.cx, it.y - Player.cy) > 24) continue;
      if (it.type === 'treasure') {
        it.got = true; Player.treasure++; Sound.treasure();
        FX.text(it.x, it.y - 16, `宝物ゲット！ ${Player.treasure}/${this.total}`, '#ffd25e');
        if (Player.treasure === this.total) FX.text(it.x, it.y + 4, 'スタート地点へ戻ろう！', '#ffffff');
      } else if (it.type === 'shell' && Player.hp < CONFIG.HP_MAX) { // HP満タンのときは残しておく
        it.got = true;
        const add = Math.min(CONFIG.SHELL_HEAL, CONFIG.HP_MAX - Player.hp);
        Player.hp += add; Sound.heal();
        FX.text(it.x, it.y - 16, `貝の力でHP回復 +${Math.round(add)}`, '#ffc6dc');
      } else if (it.type === 'bean' && Player.gas < CONFIG.GAS_MAX) { // 満タンのときは豆を残しておく
        it.got = true;
        const add = Math.min(CONFIG.BEAN_GAS, CONFIG.GAS_MAX - Player.gas);
        Player.gas += add; Sound.bean();
        FX.text(it.x, it.y - 16, `豆を食べた！ おなら+${Math.round(add)}`, '#b6f08a');
      }
    }

    // ときどき口から泡（おなら呼吸中は黄色）
    this.bubbleT -= dt;
    if (this.bubbleT <= 0 && Player.inWater()) {
      FX.bubble(Player.cx + Player.face * 14, Player.y, undefined, Player.fartAir ? 'rgba(255,225,80,.85)' : undefined);
      this.bubbleT = Player.fartAir ? 0.25 : 0.5 + Math.random() * .6;
    }
    FX.update(dt);

    // 酸素の警告音：残りわずかでゆっくり、ゼロで速くくり返す
    const P = Player, C = CONFIG;
    if (P.o2 < C.O2_LOW) {
      this.alarmT -= dt;
      if (this.alarmT <= 0) { Sound.alarm(P.o2 <= 0 ? 2 : 1); this.alarmT = P.o2 <= 0 ? 0.45 : 1.1; }
    } else this.alarmT = 0;

    // 視界の悪さ（ピンチほど外側から狭まる）
    const lost = 1 - P.hp / C.HP_MAX;
    const pinch = Math.max(P.o2 < C.O2_LOW ? (1 - P.o2 / C.O2_LOW) * 0.3 : 0, P.hp < 50 ? (1 - P.hp / 50) * 0.4 : 0);
    // おなら呼吸中は、酸素が尽きても黒ではなく黄色のまま狭まっていく
    const darkTarget = P.fartAir ? 0 : P.o2 <= 0 ? 0.35 + 0.6 * lost : pinch; // 酸素ゼロ：HPが減るほど黒く
    const yellowTarget = P.fartAir ? 0.25 + 0.7 * lost : 0;                    // おなら呼吸：HPが減るほど黄色く
    const greenTarget = P.poisoned ? 0.35 : 0;                                 // 毒ガスの中：緑にかすむ
    const k = 1 - Math.exp(-2.5 * dt);
    this.vis.dark += (darkTarget - this.vis.dark) * k;
    this.vis.yellow += (yellowTarget - this.vis.yellow) * k;
    this.vis.green += (greenTarget - this.vis.green) * k;

    // ゲームオーバー判定を先に、その後クリア判定
    if (Player.hp <= 0) { this.state = 'over'; Sound.jetStop(); UI.show('over'); return; }
    const home = Math.hypot(Player.cx - World.start.x, Player.cy - World.start.y) < 70;
    if (Player.treasure === this.total && home) { this.state = 'clear'; Sound.jetStop(); Sound.clear(); UI.show('clear'); }
  },
};

// ============================================================
// 10. 描画
// ============================================================
const cv = document.getElementById('game'), ctx = cv.getContext('2d');
let vw = 0, vh = 0, dpr = 1, hudPad = 120;
// 画面上端のHUDに船の「スタート」が隠れないよう、カメラの上の余白をHUDの高さに合わせる
function measureHud() { hudPad = document.getElementById('hud').getBoundingClientRect().bottom + 24; }
function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  vw = innerWidth; vh = innerHeight;
  cv.width = vw * dpr; cv.height = vh * dpr;
  Game.scale = Math.max(0.7, Math.min(3, Math.min(vw, vh) / CONFIG.VIEW));
  measureHud();
}
addEventListener('resize', resize); resize();

function hash(x, y) { const n = Math.sin(x * 127.1 + y * 311.7) * 43758.5453; return n - Math.floor(n); }

const Render = {
  draw() {
    const s = Game.scale, cam = Game.cam;
    const viewW = vw / s, viewH = vh / s;
    // カメラ追従（フレームレートに依存しない補間。上端はHUDの分だけ余白を取る）
    const k = 1 - Math.exp(-7 * Game.dt);
    cam.x += (Player.cx - cam.x) * k; cam.y += (Player.cy - cam.y) * k;
    const cx = Math.max(viewW / 2, Math.min(World.w - viewW / 2, cam.x));
    const cy = Math.max(viewH / 2 - hudPad / s, Math.min(World.h - viewH / 2, cam.y));
    const ox = cx - viewW / 2, oy = cy - viewH / 2;

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.fillStyle = '#061a33'; ctx.fillRect(0, 0, vw, vh);
    ctx.setTransform(dpr * s, 0, 0, dpr * s, -ox * dpr * s, -oy * dpr * s);

    this.background(ox, oy, viewW, viewH);
    this.tiles(ox, oy, viewW, viewH);
    this.boat();
    this.items();
    this.enemies();
    this.player();
    this.particles();
    this.surface(ox, viewW);
    this.texts();

    // 深さに応じて暗くする
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const depth = Math.max(0, Math.min(1, (Player.cy - World.waterTop) / (World.h - World.waterTop - 64)));
    const px = (Player.cx - ox) * s, py = (Player.cy - oy) * s;
    const g = ctx.createRadialGradient(px, py, 60 * s, px, py, 260 * s);
    g.addColorStop(0, 'rgba(2,8,20,0)'); g.addColorStop(1, `rgba(2,8,20,${0.75 * depth})`);
    ctx.fillStyle = g; ctx.fillRect(0, 0, vw, vh);
    // ピンチの視界：酸素ゼロは黒、おなら呼吸は黄色が外側から迫ってくる
    const far = Math.max(Math.hypot(px, py), Math.hypot(vw - px, py), Math.hypot(px, vh - py), Math.hypot(vw - px, vh - py));
    this.vignette(px, py, far, s, Game.vis.green, '40,110,20', 0.75);
    this.vignette(px, py, far, s, Game.vis.yellow, '150,130,10', 0.92);
    this.vignette(px, py, far, s, Game.vis.dark, '0,0,0', 0.97);
    if (Player.hurt > 0) {
      const a = reduceMotion ? 0.14 : 0.12 + 0.08 * Math.sin(Game.clock * 12);
      ctx.fillStyle = `rgba(255,60,60,${a})`; ctx.fillRect(0, 0, vw, vh);
    }
    // おならの黄色フラッシュ
    if (Game.flash > 0) {
      ctx.fillStyle = `rgba(255,228,70,${(reduceMotion ? 0.15 : 0.42) * Game.flash})`; ctx.fillRect(0, 0, vw, vh);
    }
    this.homeArrow(ox, oy, s);
  },
  // sev 0 で見えない → 1 でプレイヤーのまわり以外が塗りつぶされる
  vignette(px, py, far, s, sev, rgb, alpha) {
    if (sev < 0.01) return;
    const inner = far + (48 * s - far) * Math.min(1, sev);
    const outer = inner + (150 - 90 * sev) * s;
    const g = ctx.createRadialGradient(px, py, inner, px, py, outer);
    g.addColorStop(0, `rgba(${rgb},0)`); g.addColorStop(1, `rgba(${rgb},${alpha * Math.min(1, sev * 1.6)})`);
    ctx.fillStyle = g; ctx.fillRect(0, 0, vw, vh);
  },
  background(ox, oy, w, h) {
    const wt = World.waterTop;
    const sky = ctx.createLinearGradient(0, 0, 0, wt);
    sky.addColorStop(0, '#7fd3f5'); sky.addColorStop(1, '#d6f3ff');
    ctx.fillStyle = sky; ctx.fillRect(ox, Math.min(oy, -400), w, wt - Math.min(oy, -400));
    const sea = ctx.createLinearGradient(0, wt, 0, World.h);
    sea.addColorStop(0, '#1d9cc4'); sea.addColorStop(0.35, '#0f5f8f'); sea.addColorStop(1, '#061e3d');
    ctx.fillStyle = sea; ctx.fillRect(ox, wt, w, World.h - wt + 200);
    // 光の筋
    ctx.save(); ctx.globalAlpha = 0.07; ctx.fillStyle = '#ffffff';
    for (let i = 0; i < 8; i++) {
      const x = i * 260 + Math.sin(Game.clock * 0.3 + i) * 30;
      ctx.beginPath(); ctx.moveTo(x, wt); ctx.lineTo(x + 60, wt); ctx.lineTo(x + 220, wt + 520); ctx.lineTo(x + 120, wt + 520); ctx.fill();
    }
    ctx.restore();
  },
  tiles(ox, oy, w, h) {
    const x0 = Math.max(0, Math.floor(ox / T)), x1 = Math.min(World.cols - 1, Math.floor((ox + w) / T));
    const y0 = Math.max(0, Math.floor(oy / T)), y1 = Math.min(World.rows - 1, Math.floor((oy + h) / T));
    const rockImg = Assets.img.rock;
    for (let ty = y0; ty <= y1; ty++) for (let tx = x0; tx <= x1; tx++) {
      const c = World.grid[ty][tx];
      if (c === 'A') { this.airTile(tx, ty); continue; }
      if (c === 'P') { this.poisonTile(tx, ty); continue; }
      if (!World.solid(tx, ty)) continue;
      const x = tx * T, y = ty * T, v = hash(tx, ty);
      if (rockImg) ctx.drawImage(rockImg, x, y, T + .5, T + .5);
      else { ctx.fillStyle = v < .5 ? '#3b3a4f' : '#34334a'; ctx.fillRect(x, y, T + .5, T + .5); }
      if (!World.solid(tx, ty - 1)) {
        ctx.fillStyle = '#d8c48f'; ctx.fillRect(x, y, T + .5, 6); // 砂
        if (v > .55) { // 海藻
          ctx.strokeStyle = v > .8 ? '#3fae6a' : '#e0708c'; ctx.lineWidth = 3; ctx.lineCap = 'round';
          ctx.beginPath(); ctx.moveTo(x + 10 + v * 10, y);
          for (let k = 1; k <= 4; k++) ctx.lineTo(x + 10 + v * 10 + Math.sin(Game.clock * 2 + k + tx) * 4, y - k * 7);
          ctx.stroke();
        }
      } else if (!rockImg && (!World.solid(tx - 1, ty) || !World.solid(tx + 1, ty) || !World.solid(tx, ty + 1))) {
        ctx.fillStyle = 'rgba(255,255,255,.06)'; ctx.fillRect(x + 4, y + 4, T - 8, T - 8);
      }
    }
  },
  // 空気だまり：明るい空気と、下側の水面
  airTile(tx, ty) {
    const x = tx * T, y = ty * T;
    ctx.fillStyle = 'rgba(190,232,250,.88)'; ctx.fillRect(x, y, T + .5, T + .5);
    const below = World.grid[ty + 1]?.[tx];
    if (below && below !== 'A' && below !== '#') {
      ctx.strokeStyle = 'rgba(255,255,255,.75)'; ctx.lineWidth = 2; ctx.beginPath();
      for (let k = 0; k <= 4; k++) { const wx = x + k * T / 4, wy = y + T + Math.sin(wx * 0.04 + Game.clock * 2) * 2; k ? ctx.lineTo(wx, wy) : ctx.moveTo(wx, wy); }
      ctx.stroke();
    }
  },
  // 毒ガス：ゆらぐ黄色のもやと、のぼる泡
  poisonTile(tx, ty) {
    const x = tx * T, y = ty * T, v = hash(tx, ty);
    ctx.fillStyle = `rgba(206,206,14,${0.2 + 0.06 * Math.sin(Game.clock * 2 + tx + ty)})`; ctx.fillRect(x, y, T + .5, T + .5);
    ctx.fillStyle = 'rgba(226,226,54,.55)';
    for (let k = 0; k < 2; k++) {
      const by = y + T - ((Game.clock * 14 + (v + k * 0.5) * T) % T);
      const bx = x + (0.2 + v * 0.4 + k * 0.3) * T + Math.sin(Game.clock * 2 + k + tx) * 3;
      ctx.beginPath(); ctx.arc(bx, by, 2.2, 0, 7); ctx.fill();
    }
  },
  boat() {
    const {x} = World.start, wt = World.waterTop, b = Math.sin(Game.clock * 1.5) * 2;
    ctx.save(); ctx.translate(x, wt + b);
    let top = -88;
    if (Assets.draw('boat', 0, -ASSETS.images.boat.h / 2 + 4, Game.clock)) top = -ASSETS.images.boat.h - 6;
    else {
      ctx.fillStyle = '#f3efe4'; ctx.fillRect(-4, -78, 4, 54);
      ctx.fillStyle = '#ff7fae'; ctx.beginPath(); ctx.moveTo(0, -76); ctx.lineTo(30, -58); ctx.lineTo(0, -40); ctx.fill();
      ctx.fillStyle = '#c4533a'; ctx.beginPath(); ctx.moveTo(-50, -24); ctx.lineTo(50, -24); ctx.lineTo(36, 4); ctx.lineTo(-36, 4); ctx.fill();
      ctx.fillStyle = '#f3efe4'; ctx.fillRect(-46, -24, 92, 5);
    }
    ctx.font = '800 13px "M PLUS Rounded 1c",sans-serif'; ctx.textAlign = 'center';
    ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(0,40,70,.6)'; ctx.strokeText('スタート', 0, top);
    ctx.fillStyle = '#ffffff'; ctx.fillText('スタート', 0, top);
    ctx.restore();
  },
  items() {
    for (const it of World.items) {
      if (it.got) continue;
      const bob = Math.sin(Game.clock * 2 + it.x) * 3;
      ctx.save(); ctx.translate(it.x, it.y + bob);
      if (it.type === 'treasure') {
        ctx.fillStyle = 'rgba(255,210,94,.25)'; ctx.beginPath(); ctx.arc(0, 0, 20 + Math.sin(Game.clock * 4) * 3, 0, 7); ctx.fill();
        if (!Assets.draw('treasure', 0, 0, Game.clock)) {
          ctx.fillStyle = '#8a4b1f'; ctx.fillRect(-12, -6, 24, 16);
          ctx.fillStyle = '#b5652a'; ctx.fillRect(-12, -12, 24, 8);
          ctx.fillStyle = '#ffd25e'; ctx.fillRect(-12, -6, 24, 3); ctx.fillRect(-3, -6, 6, 8);
        }
      } else if (it.type === 'shell') {
        ctx.fillStyle = 'rgba(255,180,210,.22)'; ctx.beginPath(); ctx.arc(0, 0, 18, 0, 7); ctx.fill();
        if (!Assets.draw('shell', 0, 0, Game.clock)) {
          ctx.fillStyle = '#f6c7d6'; ctx.beginPath(); ctx.moveTo(0, 8); ctx.arc(0, 8, 14, Math.PI * 1.12, Math.PI * 1.88); ctx.closePath(); ctx.fill();
          ctx.strokeStyle = '#d98fa8'; ctx.lineWidth = 1.5; ctx.beginPath();
          for (let i = -2; i <= 2; i++) { ctx.moveTo(0, 8); ctx.lineTo(Math.sin(i * 0.28) * 13, 8 - Math.cos(i * 0.28) * 13); }
          ctx.stroke();
          ctx.fillStyle = '#e8a9be'; ctx.fillRect(-4, 6, 8, 4);
        }
      } else if (!Assets.draw('bean', 0, 0, Game.clock)) {
        ctx.fillStyle = '#7fcf4f'; ctx.beginPath(); ctx.ellipse(0, 0, 11, 7, -0.4, 0, 7); ctx.fill();
        ctx.fillStyle = '#b6f08a'; ctx.beginPath(); ctx.ellipse(-3, -2, 4, 2, -0.4, 0, 7); ctx.fill();
      }
      ctx.restore();
    }
  },
  enemies() {
    for (const e of Enemies.list) {
      ctx.save(); ctx.translate(e.x, e.y);
      if (e.stun > 0) { ctx.globalAlpha = 0.55; ctx.rotate(Math.sin(Game.clock * 8) * 0.35); } // ひるんで力が抜けている
      if (e.type === 'fish') {
        ctx.scale(e.vx < 0 ? -1 : 1, 1);
        if (!Assets.draw('fish', 0, 0, Game.clock + e.ph, 1 + e.puff * 0.5)) this.fish(e);
      } else if (!Assets.draw('jelly', 0, 0, Game.clock + e.ph)) this.jelly(e);
      ctx.restore();
    }
  },
  fish(e) {
    const r = e.r;
    // トゲ（近づくとふくらんで伸びる）
    ctx.strokeStyle = '#a8461f'; ctx.lineWidth = 2; ctx.lineCap = 'round';
    const sl = 3 + e.puff * 5;
    for (let i = 0; i < 12; i++) {
      const a = i / 12 * Math.PI * 2;
      ctx.beginPath(); ctx.moveTo(Math.cos(a) * r * .9, Math.sin(a) * r * .9); ctx.lineTo(Math.cos(a) * (r + sl), Math.sin(a) * (r + sl)); ctx.stroke();
    }
    // 尾びれ
    const tw = Math.sin(Game.clock * 10 + e.ph) * 3;
    ctx.fillStyle = '#e0762f'; ctx.beginPath(); ctx.moveTo(-r + 2, 0); ctx.lineTo(-r - 10, -7 + tw); ctx.lineTo(-r - 10, 7 + tw); ctx.fill();
    // 体
    ctx.fillStyle = '#ff9f43'; ctx.beginPath(); ctx.arc(0, 0, r, 0, 7); ctx.fill();
    ctx.fillStyle = '#ffd9a0'; ctx.beginPath(); ctx.ellipse(1, r * .35, r * .7, r * .45, 0, 0, 7); ctx.fill();
  },
  jelly(e) {
    const pulse = 1 + Math.sin(Game.clock * 3 + e.ph) * 0.08, r = e.r;
    // 触手
    ctx.strokeStyle = 'rgba(230,170,255,.7)'; ctx.lineWidth = 2; ctx.lineCap = 'round';
    for (let i = 0; i < 5; i++) {
      const bx = -r * .7 + i * r * .35;
      ctx.beginPath(); ctx.moveTo(bx, 2);
      for (let k = 1; k <= 4; k++) ctx.lineTo(bx + Math.sin(Game.clock * 3 + i + k) * 3, 2 + k * 5);
      ctx.stroke();
    }
    // かさ
    ctx.fillStyle = 'rgba(200,140,255,.25)'; ctx.beginPath(); ctx.arc(0, -2, r * 1.5, 0, 7); ctx.fill();
    ctx.fillStyle = 'rgba(205,150,255,.85)';
    ctx.beginPath(); ctx.ellipse(0, 0, r * pulse, r * .9 / pulse, 0, Math.PI, 0); ctx.closePath(); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.5)'; ctx.beginPath(); ctx.ellipse(-r * .35, -r * .5, 3.5, 2, -0.5, 0, 7); ctx.fill();
  },
  player() {
    const p = Player;
    ctx.save(); ctx.translate(p.cx, p.cy);

    // おなら呼吸中の黄色い泡
    if (p.fartAir) {
      const wob = Math.sin(Game.clock * 5) * 1.5;
      ctx.fillStyle = 'rgba(255,225,70,.22)'; ctx.strokeStyle = 'rgba(255,235,120,.85)'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.ellipse(0, 0, 27 + wob, 22 - wob, 0, 0, 7); ctx.fill(); ctx.stroke();
      ctx.fillStyle = 'rgba(255,255,220,.7)'; ctx.beginPath(); ctx.ellipse(-10, -12, 5, 2.5, -0.5, 0, 7); ctx.fill();
    }

    ctx.scale(p.face, 1);
    const tilt = Math.max(-0.5, Math.min(0.5, p.vy / 300)); ctx.rotate(tilt * p.face);
    if (p.inv > 0 && Math.sin(Game.clock * 30) > 0) ctx.globalAlpha = 0.45;
    else if (p.hurt > 0 && Math.sin(Game.clock * 30) > 0) ctx.globalAlpha = 0.6;

    // 泳いでいるほど速くコマ送り（kick は泳ぐと1秒に12、止まると3進む）
    if (!Assets.draw('player', 0, 0, p.kick / 12)) this.slime(p);
    ctx.restore();
  },
  slime(p) {
    const k = Math.sin(p.kick) * 4, arm = Math.sin(p.kick + 1.4) * 4;
    const G = '#5fd35a', D = '#2a7d34';
    // 手足（縁取り→本体の順）
    const limbs = [
      [-8, 1, -16, 1 + k, -24, 0 + k * 1.2],   // 足
      [-8, 4, -16, 5 - k, -23, 6 - k * 1.2],   // 足
      [5, 3, 10, 8 + arm, 16, 7 + arm],        // 手
      [3, 2, -1, 7 - arm, -4, 10 - arm],       // 手
    ];
    ctx.lineCap = 'round';
    for (const [lw, col] of [[8, D], [5, G]]) {
      ctx.lineWidth = lw; ctx.strokeStyle = col;
      for (const [x0, y0, x1, y1, x2, y2] of limbs) { ctx.beginPath(); ctx.moveTo(x0, y0); ctx.quadraticCurveTo(x1, y1, x2, y2); ctx.stroke(); }
    }
    // 体と頭（縁取り）
    ctx.fillStyle = D;
    ctx.beginPath(); ctx.ellipse(-1, 2, 12.5, 8, 0, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.arc(11, -3, 9.5, 0, 7); ctx.fill();
    // 体と頭（本体）
    ctx.fillStyle = G;
    ctx.beginPath(); ctx.ellipse(-1, 2, 11, 6.5, 0, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.arc(11, -3, 8, 0, 7); ctx.fill();
    // とろっと垂れるしずく
    const drip = 7 + Math.sin(Game.clock * 3) * 1.5;
    ctx.beginPath(); ctx.arc(-5, drip, 2.2, 0, 7); ctx.fill();
    // ツヤ
    ctx.fillStyle = 'rgba(230,255,215,.8)';
    ctx.beginPath(); ctx.ellipse(8, -8, 3.2, 1.8, -0.4, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.ellipse(-5, -2, 4, 1.4, 0, 0, 7); ctx.fill();
  },
  particles() {
    for (const p of FX.parts) {
      ctx.globalAlpha = Math.min(1, p.life);
      ctx.fillStyle = p.color; ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 7); ctx.fill();
    }
    ctx.globalAlpha = 1;
  },
  surface(ox, w) {
    ctx.strokeStyle = 'rgba(255,255,255,.7)'; ctx.lineWidth = 2; ctx.beginPath();
    for (let x = Math.floor(ox / 8) * 8; x <= ox + w + 8; x += 8) {
      const y = World.waterTop + Math.sin(x * 0.04 + Game.clock * 2) * 2;
      x === Math.floor(ox / 8) * 8 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    }
    ctx.stroke();
  },
  texts() {
    ctx.textAlign = 'center'; ctx.font = '800 13px "M PLUS Rounded 1c",sans-serif';
    for (const t of FX.texts) {
      ctx.globalAlpha = Math.min(1, t.life);
      ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(0,20,40,.8)'; ctx.strokeText(t.s, t.x, t.y);
      ctx.fillStyle = t.color; ctx.fillText(t.s, t.x, t.y);
    }
    ctx.globalAlpha = 1;
  },
  homeArrow(ox, oy, s) {
    if (Game.state !== 'play' || Player.treasure < Game.total) return;
    const sx = (World.start.x - ox) * s, sy = (World.start.y - oy) * s;
    if (sx > 0 && sx < vw && sy > 0 && sy < vh) return;
    const cx = vw / 2, cy = vh / 2, a = Math.atan2(sy - cy, sx - cx);
    const r = Math.min(vw, vh) / 2 - 50;
    ctx.save(); ctx.translate(cx + Math.cos(a) * r, cy + Math.sin(a) * r); ctx.rotate(a);
    ctx.fillStyle = '#ffd25e'; ctx.beginPath(); ctx.moveTo(18, 0); ctx.lineTo(-10, -12); ctx.lineTo(-4, 0); ctx.lineTo(-10, 12); ctx.fill();
    ctx.restore();
  },
};

// ============================================================
// 11. HUD と画面オーバーレイ
// ============================================================
const $ = id => document.getElementById(id);
const HELP = `<dl>
  <dt>泳ぐ</dt><dd>矢印キー / WASD<br>スマホ：画面をドラッグ（どこでもOK）</dd>
  <dt>おなら噴射</dt><dd>Space / J を<b>長押し</b><br>スマホ：ピンクのボタンを長押し</dd>
  <dt class="y">おなら呼吸</dt><dd>K / E キー<br>スマホ：黄色いボタン</dd>
  <dt>一時停止</dt><dd>Esc / H キー、または右上の「?」</dd>
</dl>
<p>スライムの体は重くて<b>沈みやすく、上に泳ぐのは苦手</b>。押している間だけおならゲージを使って<b>噴射</b>し、すいすい進もう。</p>
<p>酸素が尽きそうなら最終手段の<b class="y">おなら呼吸</b>。おならゲージを半分使って酸素を大きく回復します。ゲージが<b>白い線</b>を超えていれば使えます（黄色いボタンのリングが一周した状態）。ただし黄色い泡に包まれておならで息をすることになり、水面に出るまで<b>酸素の減りが速く、HPも少しずつ減ります</b>。</p>
<p>クラゲやトゲトゲ魚に当たるとダメージ。噴射の<b>後ろに出るガス</b>を浴びせると、敵はひるんでしばらく無害になります。</p>
<p>緑のもやは<b>毒ガス</b>。中にいるとHPと酸素が減ります（おなら呼吸の泡の中なら防げます）。洞窟の天井の<b>空気だまり</b>に顔を出せば、水面と同じく息ができてHPも少しずつ回復。<b>船のそば</b>ではHPが一気に回復し、<b>貝</b>を拾ってもHPが回復します。</p>
<p>おならは時間でわずかにたまり、海底の<b>豆</b>でも補給できます。ピンチになるほど視界が狭まっていくので注意。</p>
<p>さらに深い<b>深海</b>では、深く潜るほど酸素の減りが速くなります。毒ガスの迷路の奥には宝物と、毒のない小さな空気だまりが隠れています。</p>`;

const UI = {
  show(kind) {
    const card = $('card'), p = Player;
    const time = `${Math.floor(Game.time / 60)}分${String(Math.floor(Game.time % 60)).padStart(2, '0')}秒`;
    if (kind === 'title') card.innerHTML = `<h1>プクプク<span>海底探検</span></h1>
      <p>緑のスライムになって、海に沈んだ宝物を${Game.total}つ集め、スタートの船まで帰ってこよう。</p>${HELP}
      <button class="go" id="goBtn">はじめる</button>`;
    if (kind === 'help') card.innerHTML = `<h1>操作方法</h1>${HELP}<button class="go" id="goBtn">つづける</button>`;
    if (kind === 'clear') card.innerHTML = `<h1>帰還成功！</h1><div class="big">タイム ${time}</div>
      <p>宝物 ${p.treasure}/${Game.total}・残りHP ${Math.ceil(p.hp)}・おなら残り ${Math.round(p.gas)}%</p><button class="go" id="goBtn">もう一度あそぶ</button>`;
    if (kind === 'over') card.innerHTML = `<h1>力尽きた…</h1><p>酸素切れと敵に注意。おなら呼吸は水面に出るまでHPが減り続けるので、早めに浮上しよう。</p>
      <p>集めた宝物 ${p.treasure}/${Game.total}</p><button class="go" id="goBtn">リトライ</button>`;
    $('overlay').hidden = false;
    $('goBtn').onclick = () => { Sound.init(); kind === 'help' ? UI.resume() : Game.start(); };
    $('goBtn').focus();
  },
  hide() { $('overlay').hidden = true; },
  pause() { if (Game.state === 'play') { Game.state = 'pause'; Input.clear(); Sound.jetStop(); UI.show('help'); } },
  resume() { if (Game.state === 'pause') { Game.state = 'play'; UI.hide(); } },
  hud() {
    const p = Player;
    $('o2').style.width = (p.o2 / CONFIG.O2_MAX * 100) + '%';
    $('hp').style.width = (p.hp / CONFIG.HP_MAX * 100) + '%';
    $('gas').style.width = (p.gas / CONFIG.GAS_MAX * 100) + '%';
    $('o2').classList.toggle('fart', p.fartAir);
    $('o2Label').classList.toggle('fart', p.fartAir);
    $('o2').parentElement.classList.toggle('low', p.o2 < 25);
    $('hp').parentElement.classList.toggle('low', p.o2 <= 0 || p.fartAir || p.hp < 25);
    const canBreathe = p.gas >= CONFIG.BREATH_GAS;
    $('gasMark').style.left = (CONFIG.BREATH_GAS / CONFIG.GAS_MAX * 100) + '%';
    $('gasMark').classList.toggle('ready', canBreathe);
    $('jetBtn').classList.toggle('empty', p.gas <= 0);
    $('breathBtn').classList.toggle('empty', !canBreathe);
    $('breathBtn').classList.toggle('ready', canBreathe && p.o2 < CONFIG.O2_LOW && p.underwater());
    $('breathBtn').style.setProperty('--p', Math.min(1, p.gas / CONFIG.BREATH_GAS).toFixed(3));
    Heart.draw();
    const done = p.treasure >= Game.total;
    const m = Math.max(0, Math.round((p.cy - World.waterTop) / T * CONFIG.METERS_PER_TILE));
    const depth = World.inDeep(p.cy) ? `<span class="deep">水深 ${m}m・深海</span>` : `水深 ${m}m`;
    const goal = done ? `<span class="t">船へ帰還せよ！</span><br>黄色の矢印の方向へ・${depth}`
                      : `<span class="t">宝物 ${p.treasure} / ${Game.total}</span><br>${depth}`;
    if ($('goal').innerHTML !== goal) $('goal').innerHTML = goal;
  },
};

// ============================================================
// 12. イベント登録
// ============================================================
addEventListener('keydown', e => {
  if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].includes(e.code)) e.preventDefault();
  Sound.init();
  if (e.code === 'Escape' || e.code === 'KeyH') { Game.state === 'play' ? UI.pause() : UI.resume(); return; }
  if (!$('overlay').hidden) {
    // ボタン標準のクリックと二重にならないよう、ここで一度だけ押す
    if ((e.code === 'Enter' || e.code === 'Space') && !e.repeat) { e.preventDefault(); $('goBtn').click(); }
    return;
  }
  if (Game.state === 'play' && (e.code === 'KeyK' || e.code === 'KeyE') && !e.repeat) { Input.breathQueued = true; return; }
  Input.keys.add(e.code);
});
addEventListener('keyup', e => Input.keys.delete(e.code));
addEventListener('blur', () => Input.clear());

// タッチ用バーチャルスティック（画面のどこでもドラッグで操作）
const stickEl = $('stick'), knob = $('knob'), R = 50;
cv.addEventListener('pointerdown', e => {
  Sound.init();
  if (Game.state !== 'play' || Input.stick.id !== null) return;
  Object.assign(Input.stick, {id: e.pointerId, ox: e.clientX, oy: e.clientY, x: 0, y: 0});
  cv.setPointerCapture(e.pointerId);
  stickEl.style.display = 'block'; stickEl.style.left = e.clientX + 'px'; stickEl.style.top = e.clientY + 'px';
  knob.style.transform = '';
});
cv.addEventListener('pointermove', e => {
  const st = Input.stick; if (e.pointerId !== st.id) return;
  let dx = e.clientX - st.ox, dy = e.clientY - st.oy;
  const len = Math.hypot(dx, dy); if (len > R) { dx *= R / len; dy *= R / len; }
  st.x = Math.abs(dx) < 6 ? 0 : dx / R; st.y = Math.abs(dy) < 6 ? 0 : dy / R;
  knob.style.transform = `translate(${dx}px,${dy}px)`;
});
const endStick = e => { if (e.pointerId !== Input.stick.id) return; Object.assign(Input.stick, {id: null, x: 0, y: 0}); stickEl.style.display = 'none'; };
cv.addEventListener('pointerup', endStick); cv.addEventListener('pointercancel', endStick);

// おなら噴射ボタン（押している間ずっと）
const jetBtn = $('jetBtn');
jetBtn.addEventListener('pointerdown', e => {
  e.preventDefault(); Sound.init();
  if (Game.state !== 'play') return;
  Input.jetTouch = e.pointerId; jetBtn.setPointerCapture(e.pointerId); jetBtn.classList.add('press');
});
const endJet = e => { if (e.pointerId === Input.jetTouch) Input.jetTouch = null; jetBtn.classList.remove('press'); };
jetBtn.addEventListener('pointerup', endJet); jetBtn.addEventListener('pointercancel', endJet);

// おなら呼吸ボタン（1回押し）
const breathBtn = $('breathBtn');
breathBtn.addEventListener('pointerdown', e => {
  e.preventDefault(); Sound.init(); breathBtn.classList.add('press');
  if (Game.state === 'play') Input.breathQueued = true;
});
['pointerup', 'pointerleave', 'pointercancel'].forEach(n => breathBtn.addEventListener(n, () => breathBtn.classList.remove('press')));

$('helpBtn').addEventListener('click', e => { Game.state === 'play' ? UI.pause() : UI.resume(); e.currentTarget.blur(); });
document.addEventListener('visibilitychange', () => { if (document.hidden) UI.pause(); });
if (matchMedia('(pointer:coarse)').matches) document.querySelectorAll('.fbtn small').forEach(el => el.remove());

// ============================================================
// 13. メインループ
// ============================================================
let last = performance.now(), frame = 0;
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  Game.update(dt);
  if ((frame = (frame + 1) % 30) === 0) measureHud();
  Render.draw();
  UI.hud();
  requestAnimationFrame(loop);
}
Game.reset();
UI.show('title');
requestAnimationFrame(loop);
}
</script>
